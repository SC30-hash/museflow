<!DOCTYPE html>
<html lang="zh" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创作 - MuseFlow</title>
    <style id="theme-vars">
/* MuseFlow 音乐灵感工作室 — Tech Black-Orange Brand Tokens */
/* Single primary hue only; no secondary / accent brand variables. */

:root {
  /* Neutral dark palette */
  --museflow-neutral-950: #050505;
  --museflow-neutral-900: #0B0B0C;
  --museflow-neutral-800: #131316;
  --museflow-neutral-700: #1C1C20;
  --museflow-neutral-600: #27272A;
  --museflow-neutral-500: #52525B;
  --museflow-neutral-400: #A1A1AA;
  --museflow-neutral-300: #D4D4D8;
  --museflow-neutral-100: #F4F4F5;

  /* One primary hue — tech orange */
  --museflow-primary-500: #FF5F1F;
  --museflow-primary-600: #E65100;
  --museflow-primary-400: #FF8A4C;
  --museflow-primary-100: #331000;

  /* Semantic aliases required by head contract */
  --museflow-background: var(--museflow-neutral-950);
  --museflow-foreground: var(--museflow-neutral-100);

  --museflow-card: var(--museflow-neutral-900);
  --museflow-card-foreground: var(--museflow-neutral-100);

  --museflow-popover: var(--museflow-neutral-800);
  --museflow-popover-foreground: var(--museflow-neutral-100);

  --museflow-primary: var(--museflow-primary-500);
  --museflow-primary-foreground: #FFFFFF;

  --museflow-muted: var(--museflow-neutral-800);
  --museflow-muted-foreground: var(--museflow-neutral-400);

  --museflow-border: var(--museflow-neutral-700);
  --museflow-input: var(--museflow-neutral-800);
  --museflow-ring: var(--museflow-primary-500);

  /* Radius scale */
  --museflow-radius-xs: 2px;
  --museflow-radius-sm: 4px;
  --museflow-radius-md: 8px;
  --museflow-radius-lg: 16px;
  --museflow-radius-pill: 999px;

  /* Typography */
  --museflow-font-sans: 'Inter', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
  --museflow-font-mono: 'SF Mono', 'SFMono-Regular', ui-monospace, monospace;

  /* Static shadows (alpha <= 0.05) */
  --museflow-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.05), 0 1px 1px rgba(0, 0, 0, 0.03);
  --museflow-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.05);

  /* Safe-area spacing */
  --museflow-safe-top: env(safe-area-inset-top, 0px);
  --museflow-safe-bottom: env(safe-area-inset-bottom, 0px);
  --museflow-safe-left: env(safe-area-inset-left, 0px);
  --museflow-safe-right: env(safe-area-inset-right, 0px);
}

html {
  font-family: var(--museflow-font-sans);
  background-color: var(--museflow-background);
  color: var(--museflow-foreground);
}

body {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--museflow-background);
    --color-foreground: var(--museflow-foreground);
    --color-card: var(--museflow-card);
    --color-card-foreground: var(--museflow-card-foreground);
    --color-popover: var(--museflow-popover);
    --color-popover-foreground: var(--museflow-popover-foreground);
    --color-primary: var(--museflow-primary);
    --color-primary-foreground: var(--museflow-primary-foreground);
    --color-muted: var(--museflow-muted);
    --color-muted-foreground: var(--museflow-muted-foreground);
    --color-border: var(--museflow-border);
    --color-input: var(--museflow-input);
    --color-ring: var(--museflow-ring);
    --radius-sm: var(--museflow-radius-sm);
    --radius-md: var(--museflow-radius-md);
    --radius-lg: var(--museflow-radius-lg);
  }
  @layer base {
    body { background: var(--museflow-background); color: var(--museflow-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--museflow-background); }
      .text-background { color: var(--museflow-background); }
      .border-background { border-color: var(--museflow-background); }
      .ring-background { --tw-ring-color: var(--museflow-background); }
      .bg-foreground { background-color: var(--museflow-foreground); }
      .text-foreground { color: var(--museflow-foreground); }
      .border-foreground { border-color: var(--museflow-foreground); }
      .ring-foreground { --tw-ring-color: var(--museflow-foreground); }
      .bg-card { background-color: var(--museflow-card); }
      .text-card { color: var(--museflow-card); }
      .border-card { border-color: var(--museflow-card); }
      .ring-card { --tw-ring-color: var(--museflow-card); }
      .bg-card-foreground { background-color: var(--museflow-card-foreground); }
      .text-card-foreground { color: var(--museflow-card-foreground); }
      .border-card-foreground { border-color: var(--museflow-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--museflow-card-foreground); }
      .bg-popover { background-color: var(--museflow-popover); }
      .text-popover { color: var(--museflow-popover); }
      .border-popover { border-color: var(--museflow-popover); }
      .ring-popover { --tw-ring-color: var(--museflow-popover); }
      .bg-popover-foreground { background-color: var(--museflow-popover-foreground); }
      .text-popover-foreground { color: var(--museflow-popover-foreground); }
      .border-popover-foreground { border-color: var(--museflow-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--museflow-popover-foreground); }
      .bg-primary { background-color: var(--museflow-primary); }
      .text-primary { color: var(--museflow-primary); }
      .border-primary { border-color: var(--museflow-primary); }
      .ring-primary { --tw-ring-color: var(--museflow-primary); }
      .bg-primary-foreground { background-color: var(--museflow-primary-foreground); }
      .text-primary-foreground { color: var(--museflow-primary-foreground); }
      .border-primary-foreground { border-color: var(--museflow-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--museflow-primary-foreground); }
      .bg-muted { background-color: var(--museflow-muted); }
      .text-muted { color: var(--museflow-muted); }
      .border-muted { border-color: var(--museflow-muted); }
      .ring-muted { --tw-ring-color: var(--museflow-muted); }
      .bg-muted-foreground { background-color: var(--museflow-muted-foreground); }
      .text-muted-foreground { color: var(--museflow-muted-foreground); }
      .border-muted-foreground { border-color: var(--museflow-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--museflow-muted-foreground); }
      .bg-border { background-color: var(--museflow-border); }
      .text-border { color: var(--museflow-border); }
      .border-border { border-color: var(--museflow-border); }
      .ring-border { --tw-ring-color: var(--museflow-border); }
      .bg-input { background-color: var(--museflow-input); }
      .text-input { color: var(--museflow-input); }
      .border-input { border-color: var(--museflow-input); }
      .ring-input { --tw-ring-color: var(--museflow-input); }
      .bg-ring { background-color: var(--museflow-ring); }
      .text-ring { color: var(--museflow-ring); }
      .border-ring { border-color: var(--museflow-ring); }
      .ring-ring { --tw-ring-color: var(--museflow-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased bg-background text-foreground">
  <div class="page-frame bg-background">
    <header class="px-4 pb-3 border-b border-border bg-card/50 sticky top-0 z-10" style="padding-top: var(--museflow-safe-top);">
      <div class="flex items-end justify-between">
        <div>
          <h1 class="text-lg font-semibold tracking-tight">创作</h1>
          <p class="text-sm text-muted-foreground">简单节奏与旋律</p>
        </div>
        <button type="button" class="p-2 rounded-full hover:bg-muted transition-colors duration-150" aria-label="设置">
          <i data-lucide="settings-2" class="w-5 h-5 text-muted-foreground"></i>
        </button>
      </div>
    </header>

    <main class="page-main px-4 py-5 space-y-5">
      <!-- Transport controls -->
      <section class="bg-card border border-border rounded-2xl p-4 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs text-muted-foreground">BPM</p>
          <p class="text-xl font-semibold tabular-nums">110</p>
        </div>
        <div class="flex items-center gap-3">
          <button type="button" class="w-10 h-10 rounded-full border border-border flex items-center justify-center hover:bg-muted transition-colors duration-150" aria-label="停止">
            <i data-lucide="square" class="w-4 h-4 text-foreground"></i>
          </button>
          <button type="button" class="w-14 h-14 rounded-full bg-primary text-primary-foreground flex items-center justify-center hover:opacity-90 active:scale-[.98] transition-all duration-150" aria-label="播放">
            <i data-lucide="play" class="w-7 h-7 ml-0.5"></i>
          </button>
        </div>
      </section>

      <!-- Beat pad -->
      <section class="bg-card border border-border rounded-2xl p-4 shadow-sm">
        <h2 class="text-sm font-medium mb-3">节奏垫</h2>
        <div class="grid grid-cols-4 gap-2">
          <button type="button" class="beat-pad rounded-xl bg-muted hover:bg-primary/20 active:bg-primary active:text-primary-foreground transition-colors duration-150 flex items-center justify-center" aria-label="鼓垫 1"><i data-lucide="disc-3" class="w-5 h-5 text-muted-foreground"></i></button>
          <button type="button" class="beat-pad rounded-xl bg-muted hover:bg-primary/20 active:bg-primary active:text-primary-foreground transition-colors duration-150 flex items-center justify-center" aria-label="鼓垫 2"><i data-lucide="disc-3" class="w-5 h-5 text-muted-foreground"></i></button>
          <button type="button" class="beat-pad rounded-xl bg-muted hover:bg-primary/20 active:bg-primary active:text-primary-foreground transition-colors duration-150 flex items-center justify-center" aria-label="鼓垫 3"><i data-lucide="disc-3" class="w-5 h-5 text-muted-foreground"></i></button>
          <button type="button" class="beat-pad rounded-xl bg-muted hover:bg-primary/20 active:bg-primary active:text-primary-foreground transition-colors duration-150 flex items-center justify-center" aria-label="鼓垫 4"><i data-lucide="disc-3" class="w-5 h-5 text-muted-foreground"></i></button>
          <button type="button" class="beat-pad rounded-xl bg-muted hover:bg-primary/20 active:bg-primary active:text-primary-foreground transition-colors duration-150 flex items-center justify-center" aria-label="鼓垫 5"><i data-lucide="disc-3" class="w-5 h-5 text-muted-foreground"></i></button>
          <button type="button" class="beat-pad rounded-xl bg-muted hover:bg-primary/20 active:bg-primary active:text-primary-foreground transition-colors duration-150 flex items-center justify-center" aria-label="鼓垫 6"><i data-lucide="disc-3" class="w-5 h-5 text-muted-foreground"></i></button>
          <button type="button" class="beat-pad rounded-xl bg-muted hover:bg-primary/20 active:bg-primary active:text-primary-foreground transition-colors duration-150 flex items-center justify-center" aria-label="鼓垫 7"><i data-lucide="disc-3" class="w-5 h-5 text-muted-foreground"></i></button>
          <button type="button" class="beat-pad rounded-xl bg-muted hover:bg-primary/20 active:bg-primary active:text-primary-foreground transition-colors duration-150 flex items-center justify-center" aria-label="鼓垫 8"><i data-lucide="disc-3" class="w-5 h-5 text-muted-foreground"></i></button>
        </div>
      </section>

      <!-- Melody keys -->
      <section class="bg-card border border-border rounded-2xl p-4 shadow-sm">
        <h2 class="text-sm font-medium mb-3">旋律键</h2>
        <div class="flex gap-2 h-28">
          <button type="button" class="melody-key rounded-l-xl bg-muted hover:bg-primary/20 active:bg-primary active:text-primary-foreground transition-colors duration-150" aria-label="音符 C"></button>
          <button type="button" class="melody-key bg-muted hover:bg-primary/20 active:bg-primary active:text-primary-foreground transition-colors duration-150" aria-label="音符 D"></button>
          <button type="button" class="melody-key bg-muted hover:bg-primary/20 active:bg-primary active:text-primary-foreground transition-colors duration-150" aria-label="音符 E"></button>
          <button type="button" class="melody-key bg-muted hover:bg-primary/20 active:bg-primary active:text-primary-foreground transition-colors duration-150" aria-label="音符 F"></button>
          <button type="button" class="melody-key rounded-r-xl bg-muted hover:bg-primary/20 active:bg-primary active:text-primary-foreground transition-colors duration-150" aria-label="音符 G"></button>
        </div>
      </section>

      <!-- Loop timeline -->
      <section class="bg-card border border-border rounded-2xl p-4 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-sm font-medium">循环段</h2>
          <span class="text-xs text-muted-foreground">4 小节</span>
        </div>
        <div class="h-10 rounded-xl bg-muted overflow-hidden flex">
          <div class="flex-1 bg-primary/20 border-r border-border"></div>
          <div class="flex-1 bg-primary/40 border-r border-border"></div>
          <div class="flex-1 bg-primary/20 border-r border-border"></div>
          <div class="flex-1 bg-primary/40"></div>
        </div>
      </section>
    </main>

    <nav data-mobile-nav="global" class="w-full border-t bg-[var(--museflow-card)] h-[64px] pb-[var(--museflow-safe-bottom)]">
      <div class="w-full max-w-md mx-auto grid grid-cols-4 h-full">
        <a href="page-capture.html" data-nav-key="capture" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--museflow-muted-foreground)]">
          <i data-lucide="mic" class="w-5 h-5 shrink-0"></i>
          <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">灵感</span>
        </a>
        <a href="page-demos.html" data-nav-key="demos" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--museflow-muted-foreground)]">
          <i data-lucide="music" class="w-5 h-5 shrink-0"></i>
          <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">小样</span>
        </a>
        <a href="page-lyrics.html" data-nav-key="lyrics" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--museflow-muted-foreground)]">
          <i data-lucide="align-left" class="w-5 h-5 shrink-0"></i>
          <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">歌词</span>
        </a>
        <a href="page-sketch.html" data-nav-key="sketch" data-active="true" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--museflow-primary)] font-medium">
          <i data-lucide="sliders" class="w-5 h-5 shrink-0"></i>
          <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">创作</span>
        </a>
      </div>
    </nav>
    <script>lucide.createIcons();</script>
  </div>

    <style id="critical-layout">
      .page-frame { max-width: 28rem; margin-left: auto; margin-right: auto; min-height: 100vh; display: flex; flex-direction: column; }
      .page-main { flex: 1 1 auto; }
      [data-mobile-nav="global"] { flex-shrink: 0; }
      .beat-pad { aspect-ratio: 1 / 1; }
      .melody-key { flex: 1 1 0; min-width: 0; }
    </style>
</body>
</html>
