<!DOCTYPE html>
<html lang="zh" class="light" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MuseFlow" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>灵感 - MuseFlow</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- iOS 主屏图标（Safari "添加到主屏幕" 时显示）-->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png" />
  <!-- Android / PWA 图标 -->
  <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body class="min-h-screen font-sans antialiased bg-background text-foreground grain-bg">
  <div id="app-shell" class="app-shell">
    <div class="page-frame bg-background relative z-10">
      <!-- Dynamic header (updated by nav.js on view switch) -->
      <header id="app-header" class="px-4 pb-3 border-b border-border bg-card/50 sticky top-0 z-10 backdrop-blur" style="padding-top: var(--museflow-safe-top);">
        <div class="flex items-end justify-between">
          <div class="flex items-center gap-2">
            <i id="header-icon" data-lucide="mic" class="w-6 h-6 text-primary"></i>
            <div>
              <h1 id="header-title" class="text-base font-semibold leading-tight">灵感</h1>
              <p id="header-subtitle" class="text-xs text-muted-foreground leading-tight">捕捉一闪而过的旋律</p>
            </div>
          </div>
          <div id="header-action"></div>
        </div>
      </header>

      <!-- =================== View: 灵感 (capture) =================== -->
      <main class="page-main px-4 py-5 space-y-5" data-view="capture">
        <!-- Mode toggle -->
        <div class="p-1 bg-muted rounded-xl flex gap-1" id="mode-toggle">
          <button type="button" data-mode="rec" class="flex-1 py-2 text-sm font-medium rounded-lg bg-card text-foreground shadow-sm" aria-pressed="true">录音</button>
          <button type="button" data-mode="text" class="flex-1 py-2 text-sm font-medium rounded-lg text-muted-foreground hover:text-foreground transition-colors duration-150" aria-pressed="false">文字</button>
        </div>

        <!-- Record card -->
        <section id="record-panel" class="bg-card border border-border rounded-2xl p-3 flex flex-col gap-3 shadow-sm">
          <div class="flex items-center justify-between gap-2 flex-wrap">
            <div class="flex items-center gap-1.5">
              <button type="button" id="import-backing-btn" class="px-2.5 py-1.5 rounded-lg bg-muted text-xs font-medium text-muted-foreground flex items-center gap-1.5 hover:text-foreground transition-colors duration-150" aria-label="导入伴奏">
                <i data-lucide="music-4" class="w-3.5 h-3.5"></i><span>导入伴奏</span>
              </button>
              <button type="button" id="add-track-btn" class="px-2.5 py-1.5 rounded-lg bg-muted text-xs font-medium text-muted-foreground flex items-center gap-1.5 hover:text-foreground transition-colors duration-150" aria-label="新建音轨">
                <i data-lucide="plus" class="w-3.5 h-3.5"></i><span>加轨</span>
              </button>
            </div>
            <div class="flex items-center gap-1.5">
              <button type="button" id="transport-stop" class="w-8 h-8 rounded-md bg-muted text-muted-foreground flex items-center justify-center hover:text-foreground transition-colors duration-150" aria-label="停止"><i data-lucide="square" class="w-4 h-4"></i></button>
              <button type="button" id="transport-play" class="w-8 h-8 rounded-md bg-muted text-muted-foreground flex items-center justify-center hover:text-foreground transition-colors duration-150" aria-label="播放"><i data-lucide="play" class="w-4 h-4 ml-0.5"></i></button>
              <button type="button" id="transport-rec" class="w-8 h-8 rounded-full bg-muted text-muted-foreground flex items-center justify-center hover:text-foreground transition-colors duration-150" aria-label="录音" aria-pressed="false"><i data-lucide="circle" class="w-4 h-4"></i></button>
              <div class="ml-2 px-2.5 py-1 rounded-md bg-muted text-xs font-mono tabular-nums text-muted-foreground" id="transport-time">00:00.00</div>
            </div>
            <button type="button" id="save-project-btn" class="px-2.5 py-1.5 rounded-lg bg-primary text-primary-foreground text-xs font-medium flex items-center gap-1.5 hover:opacity-90 transition-colors duration-150" aria-label="保存工程">
              <i data-lucide="save" class="w-3.5 h-3.5"></i><span>保存工程</span>
            </button>
            <button type="button" id="wide-toggle-btn" class="px-2.5 py-1.5 rounded-lg bg-muted text-xs font-medium text-muted-foreground flex items-center gap-1.5 hover:text-foreground transition-colors duration-150" aria-label="横屏扩大" aria-pressed="false">
              <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i><span>横屏</span>
            </button>
          </div>
          <div class="rounded-xl border border-border bg-muted/30 relative" id="arranger">
            <div id="arranger-viewport" class="overflow-x-auto overflow-y-hidden">
              <div id="arranger-content" style="min-width: 100%;">
                <div class="grid border-b border-border bg-muted/50" id="time-ruler"></div>
                <div class="relative" id="tracks-host">
                  <div class="pointer-events-none absolute top-0 bottom-0 w-px bg-primary/80 transition-[left] duration-75 ease-linear" id="playhead" style="left:140px;"></div>
                  <div id="tracks-body" class="space-y-0"></div>
                </div>
              </div>
            </div>
            <div class="flex items-center gap-1.5 px-2 py-1.5 border-t border-border bg-muted/40">
              <i data-lucide="panel-left-close" class="w-3.5 h-3.5 text-muted-foreground shrink-0"></i>
              <div id="arranger-slider" class="relative flex-1 h-5 bg-muted/60 rounded cursor-pointer group">
                <div id="arranger-slider-thumb" class="absolute top-0.5 bottom-0.5 bg-primary/70 rounded transition-all" style="left:0; width:30%;"></div>
              </div>
              <i data-lucide="panel-left-open" class="w-3.5 h-3.5 text-muted-foreground shrink-0"></i>
              <div class="text-[10px] font-mono text-muted-foreground ml-1 shrink-0" id="arranger-duration-label">0s</div>
            </div>
          </div>
          <input type="file" id="backing-file" accept="audio/*,.m4a,.m4b,.m4p,.m4r" multiple class="hidden" />
        </section>

        <!-- Quick text input -->
        <section id="text-panel" class="bg-card border border-border rounded-2xl p-4 shadow-sm hidden">
          <label for="idea-text" class="block text-sm font-medium mb-2">文字灵感</label>
          <textarea id="idea-text" rows="3" placeholder="哼不出来的旋律，先写在这里…" class="w-full resize-none rounded-xl border border-input bg-input px-3 py-2.5 text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring"></textarea>
          <div class="mt-3 flex justify-end gap-2">
            <button type="button" id="save-text-btn" class="px-4 py-2 rounded-lg bg-primary text-primary-foreground text-sm font-medium hover:opacity-90 active:scale-[.99] transition-all duration-150">保存</button>
          </div>
        </section>

        <!-- Recent captures -->
        <section>
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-base font-semibold flex items-center gap-1.5"><i data-lucide="zap" class="w-4 h-4 text-primary"></i>最近捕捉</h2>
            <div class="flex items-center gap-2">
              <button type="button" id="captures-toggle-select" class="text-xs px-2 py-1 rounded-md text-muted-foreground hover:text-foreground hover:bg-muted transition-colors">
                <i data-lucide="check-square" class="w-3.5 h-3.5 inline align-middle mr-1"></i>多选
              </button>
              <span id="captures-count" class="text-xs text-muted-foreground"></span>
            </div>
          </div>
          <div id="captures-select-bar" class="hidden mb-3 flex items-center gap-2 p-2 rounded-lg bg-muted/50 border border-border">
            <label class="flex items-center gap-1.5 text-xs cursor-pointer select-none">
              <input type="checkbox" id="captures-select-all" class="accent-primary rounded-sm" />
              <span>全选</span>
            </label>
            <span class="text-xs text-muted-foreground" id="captures-selected-count">已选 0 项</span>
            <div class="ml-auto flex items-center gap-1.5">
              <button type="button" id="captures-batch-delete" class="px-2.5 py-1 rounded-md bg-destructive/15 text-destructive text-xs font-medium flex items-center gap-1 hover:bg-destructive/25 transition-colors" disabled>
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>批量删除
              </button>
              <button type="button" id="captures-select-cancel" class="px-2.5 py-1 rounded-md text-xs text-muted-foreground hover:text-foreground hover:bg-muted transition-colors">取消</button>
            </div>
          </div>
          <div class="space-y-3" id="captures-list">
            <!-- populated by JS -->
          </div>
        </section>
      </main>

      <!-- =================== View: 小样 (demos) =================== -->
      <main class="page-main px-4 py-5 space-y-5 hidden" data-view="demos">
        <!-- Upload zone -->
        <section id="upload-zone" class="bg-card border border-border rounded-2xl p-4 shadow-sm cursor-pointer transition-all duration-200">
          <div class="border-2 border-dashed border-border rounded-xl p-6 text-center hover:border-primary/50 hover:bg-primary/[0.03] transition-all duration-200">
            <input type="file" id="file-input" accept="audio/*,.mid,.midi,.m4a,.m4b,.m4p,.m4r" class="hidden" />
            <div class="flex flex-col items-center gap-3">
              <div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center">
                <i data-lucide="upload-cloud" class="w-6 h-6 text-primary"></i>
              </div>
              <div>
                <p class="text-sm font-medium text-foreground">选择音频或 MIDI 文件</p>
                <p class="text-xs text-muted-foreground mt-0.5">支持 MP3、WAV、OGG、FLAC、MIDI</p>
              </div>
              <button type="button" id="browse-btn" class="mt-1 px-4 py-2 rounded-lg bg-primary text-primary-foreground text-xs font-medium hover:opacity-90 active:scale-[.98] transition-all duration-150">
                选择文件
              </button>
            </div>
          </div>
        </section>

        <!-- Analysis status / result -->
        <section id="analysis-section" class="hidden">
          <div id="analyzing-state" class="hidden bg-card border border-border rounded-2xl p-4 shadow-sm flex items-center gap-4">
            <div class="w-10 h-10 rounded-full bg-primary/20 flex items-center justify-center shrink-0">
              <div class="w-5 h-5 border-2 border-primary/30 border-t-primary rounded-full animate-spin"></div>
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium" id="analyzing-title">正在分析…</p>
              <p class="text-xs text-muted-foreground" id="analyzing-sub">解码音频并检测节拍</p>
            </div>
          </div>

          <div id="result-state" class="hidden bg-card border border-border rounded-2xl p-4 shadow-sm">
            <div class="flex items-center gap-2 mb-4">
              <i data-lucide="audio-waveform" class="w-4 h-4 text-primary"></i>
              <h2 class="text-sm font-medium" id="result-filename">分析结果</h2>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div class="rounded-xl p-4 text-center" style="background: rgba(229, 62, 62, 0.06); border: 1px solid rgba(229, 62, 62, 0.1);">
                <p class="text-xs text-muted-foreground mb-1">调式</p>
                <p id="result-key" class="text-2xl font-semibold text-primary font-mono leading-tight">--</p>
              </div>
              <div class="rounded-xl p-4 text-center" style="background: rgba(229, 62, 62, 0.06); border: 1px solid rgba(229, 62, 62, 0.1);">
                <p class="text-xs text-muted-foreground mb-1">BPM</p>
                <p id="result-bpm" class="text-2xl font-semibold text-primary font-mono leading-tight">--</p>
              </div>
            </div>
            <div class="mt-4 flex gap-2">
              <button type="button" id="save-result-btn" class="flex-1 py-2.5 rounded-lg bg-primary text-primary-foreground text-sm font-medium hover:opacity-90 active:scale-[.98] transition-all duration-150">
                保存为小样
              </button>
              <button type="button" id="reanalyze-btn" class="px-4 py-2.5 rounded-lg bg-muted text-muted-foreground text-sm font-medium hover:text-foreground transition-colors duration-150">
                重新选择
              </button>
            </div>
          </div>
        </section>

        <!-- Saved demos list -->
        <section class="space-y-3" id="demo-list-section">
          <div class="flex items-center justify-between px-1">
            <h2 class="text-base font-semibold flex items-center gap-1.5"><i data-lucide="folder-open" class="w-4 h-4 text-primary"></i>已保存的小样</h2>
            <div class="flex items-center gap-2">
              <button type="button" id="demos-toggle-select" class="text-[11px] px-2 py-1 rounded-md text-muted-foreground hover:text-foreground hover:bg-muted transition-colors">
                <i data-lucide="check-square" class="w-3.5 h-3.5 inline align-middle mr-1"></i>多选
              </button>
              <span id="demo-count" class="text-xs text-muted-foreground"></span>
            </div>
          </div>
          <div id="demos-select-bar" class="hidden mb-2 flex items-center gap-2 p-2 rounded-lg bg-muted/50 border border-border">
            <label class="flex items-center gap-1.5 text-xs cursor-pointer select-none">
              <input type="checkbox" id="demos-select-all" class="accent-primary rounded-sm" />
              <span>全选</span>
            </label>
            <span class="text-xs text-muted-foreground" id="demos-selected-count">已选 0 项</span>
            <div class="ml-auto flex items-center gap-1.5">
              <button type="button" id="demos-batch-delete" class="px-2.5 py-1 rounded-md bg-destructive/15 text-destructive text-xs font-medium flex items-center gap-1 hover:bg-destructive/25 transition-colors" disabled>
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>批量删除
              </button>
              <button type="button" id="demos-select-cancel" class="px-2.5 py-1 rounded-md text-xs text-muted-foreground hover:text-foreground hover:bg-muted transition-colors">取消</button>
            </div>
          </div>
          <div id="demo-list" class="space-y-2">
            <!-- populated by JS -->
          </div>
        </section>

        <!-- Empty state -->
        <section id="empty-state" class="py-8 flex flex-col items-center text-center">
          <div class="empty-state-icon w-14 h-14 rounded-full flex items-center justify-center mb-3">
            <i data-lucide="music-2" class="w-6 h-6"></i>
          </div>
          <p class="text-sm text-muted-foreground">上传文件后，检测结果会出现在这里</p>
        </section>
      </main>

      <!-- =================== View: 歌词 (lyrics) =================== -->
      <main class="page-main px-4 py-5 space-y-5 hidden" data-view="lyrics">
        <!-- Quick editor -->
        <section class="bg-card border border-border rounded-2xl p-4 shadow-sm">
          <label for="lyric-title" class="block text-sm font-medium mb-2">新增手稿</label>
          <input id="lyric-title" type="text" placeholder="标题（可留空）" class="w-full rounded-xl border border-input bg-input px-3 py-2.5 text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring mb-2" />
          <label for="lyric-line" class="sr-only">歌词内容</label>
          <textarea id="lyric-line" rows="3" placeholder="第一句歌词…" class="w-full resize-y rounded-xl border border-input bg-input px-3 py-2.5 text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring"></textarea>
          <div class="mt-3 flex items-center justify-between">
            <span class="text-xs text-muted-foreground" id="auto-save-label">自动保存</span>
            <button type="button" id="save-btn" class="px-4 py-2 rounded-lg bg-primary text-primary-foreground text-sm font-medium hover:opacity-90 active:scale-[.99] transition-all duration-150">保存</button>
          </div>
        </section>

        <!-- Lyrics list -->
        <section>
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-base font-semibold flex items-center gap-1.5"><i data-lucide="file-text" class="w-4 h-4 text-primary"></i>我的手稿</h2>
            <div class="flex items-center gap-2">
              <button type="button" id="lyrics-toggle-select" class="text-xs px-2 py-1 rounded-md text-muted-foreground hover:text-foreground hover:bg-muted transition-colors">
                <i data-lucide="check-square" class="w-3.5 h-3.5 inline align-middle mr-1"></i>多选
              </button>
              <span id="lyrics-count" class="text-xs text-muted-foreground"></span>
            </div>
          </div>
          <div id="lyrics-select-bar" class="hidden mb-3 flex items-center gap-2 p-2 rounded-lg bg-muted/50 border border-border">
            <label class="flex items-center gap-1.5 text-xs cursor-pointer select-none">
              <input type="checkbox" id="lyrics-select-all" class="accent-primary rounded-sm" />
              <span>全选</span>
            </label>
            <span class="text-xs text-muted-foreground" id="lyrics-selected-count">已选 0 项</span>
            <div class="ml-auto flex items-center gap-1.5">
              <button type="button" id="lyrics-batch-delete" class="px-2.5 py-1 rounded-md bg-destructive/15 text-destructive text-xs font-medium flex items-center gap-1 hover:bg-destructive/25 transition-colors" disabled>
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>批量删除
              </button>
              <button type="button" id="lyrics-select-cancel" class="px-2.5 py-1 rounded-md text-xs text-muted-foreground hover:text-foreground hover:bg-muted transition-colors">取消</button>
            </div>
          </div>
          <div class="space-y-3" id="lyrics-list">
            <!-- populated by JS -->
          </div>
        </section>
      </main>

      <!-- nav mounted by JS -->
    </div>
  </div>

  <!-- =================== Shared modals =================== -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- 快捷文字保存模态框 -->
  <div id="quick-text-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm items-center justify-center p-4" style="display: none;">
    <div class="w-full max-w-md bg-card border border-border rounded-2xl shadow-xl p-5">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-base font-semibold font-display">文字灵感</h3>
        <button type="button" id="quick-text-close" class="p-1 rounded-full hover:bg-muted transition-colors" aria-label="关闭">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <textarea id="quick-text-area" rows="4" placeholder="哼不出来的旋律，先写在这里…" class="w-full resize-none rounded-xl border border-input bg-input px-3 py-2.5 text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring"></textarea>
      <div class="mt-3 flex justify-end gap-2">
        <button type="button" id="quick-text-save" class="px-4 py-2 rounded-lg bg-primary text-primary-foreground text-sm font-medium hover:opacity-90 active:scale-[.99] transition-all duration-150">保存</button>
      </div>
    </div>
  </div>

  <!-- 搜索模态框 -->
  <div id="search-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm items-center justify-center p-4" style="display: none;">
    <div class="w-full max-w-md bg-card border border-border rounded-2xl shadow-xl p-5">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-base font-semibold font-display">搜索</h3>
        <button type="button" id="search-close" class="p-1 rounded-full hover:bg-muted transition-colors" aria-label="关闭">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div class="relative">
        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted-foreground"></i>
        <input id="search-input" type="text" placeholder="搜索捕捉 / 歌词" class="w-full rounded-xl border border-input bg-input pl-9 pr-3 py-2.5 text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring" />
      </div>
      <div class="mt-3 flex justify-end gap-2">
        <button type="button" id="search-cancel" class="px-4 py-2 rounded-lg border border-border text-sm hover:bg-muted transition-colors">取消</button>
        <button type="button" id="search-confirm" class="px-4 py-2 rounded-lg bg-primary text-primary-foreground text-sm font-medium hover:opacity-90 active:scale-[.99] transition-all duration-150">搜索</button>
      </div>
    </div>
  </div>

  <!-- 命名模态框 -->
  <div id="name-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm items-center justify-center p-4" style="display: none;">
    <div class="w-full max-w-md bg-card border border-border rounded-2xl shadow-xl p-5">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-base font-semibold font-display">命名</h3>
        <button type="button" id="name-close" class="p-1 rounded-full hover:bg-muted transition-colors" aria-label="关闭">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <input id="name-input" type="text" placeholder="输入名称" class="w-full rounded-xl border border-input bg-input px-3 py-2.5 text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring" />
      <div class="mt-3 flex justify-end gap-2">
        <button type="button" id="name-cancel" class="px-4 py-2 rounded-lg border border-border text-sm hover:bg-muted transition-colors">取消</button>
        <button type="button" id="name-confirm" class="px-4 py-2 rounded-lg bg-primary text-primary-foreground text-sm font-medium hover:opacity-90 active:scale-[.99] transition-all duration-150">保存</button>
      </div>
    </div>
  </div>

  <!-- 确认弹框（通用） -->
  <div id="confirm-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm items-center justify-center p-4" style="display: none;">
    <div class="w-full max-w-sm bg-card border border-border rounded-2xl shadow-xl p-5">
      <div class="flex items-start gap-3 mb-4">
        <div class="w-10 h-10 shrink-0 rounded-full bg-destructive/15 flex items-center justify-center">
          <i data-lucide="alert-triangle" class="w-5 h-5 text-destructive"></i>
        </div>
        <div class="flex-1 min-w-0">
          <h3 class="text-base font-semibold mb-1">确认操作</h3>
          <p id="confirm-message" class="text-sm text-muted-foreground leading-relaxed"></p>
        </div>
      </div>
      <div class="flex justify-end gap-2">
        <button type="button" id="confirm-cancel" class="px-4 py-2 rounded-lg border border-border text-sm hover:bg-muted transition-colors">取消</button>
        <button type="button" id="confirm-ok" class="px-4 py-2 rounded-lg bg-primary text-primary-foreground text-sm font-medium hover:opacity-90 active:scale-[.99] transition-all duration-150">确定</button>
      </div>
    </div>
  </div>

  <!-- 歌词编辑模态框 -->
  <div id="editor-modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" data-close></div>
    <div class="absolute inset-x-0 bottom-0 md:inset-0 m-auto md:max-w-lg md:rounded-2xl rounded-t-2xl bg-card border border-border shadow-2xl p-5 max-h-[85vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-base font-semibold">编辑歌词</h3>
        <button type="button" class="p-2 rounded-full hover:bg-muted" data-close aria-label="关闭"><i data-lucide="x" class="w-5 h-5 text-muted-foreground"></i></button>
      </div>
      <input id="edit-title" type="text" placeholder="标题" class="w-full rounded-xl border border-input bg-input px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-ring mb-2" />
      <textarea id="edit-body" rows="8" placeholder="写下你的歌词…" class="w-full resize-y rounded-xl border border-input bg-input px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-ring"></textarea>
      <div class="mt-4 flex justify-end gap-2">
        <button type="button" class="px-4 py-2 rounded-lg border border-border text-sm" data-close>取消</button>
        <button type="button" id="edit-save" class="px-4 py-2 rounded-lg bg-primary text-primary-foreground text-sm font-medium hover:opacity-90 transition-all">保存</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
