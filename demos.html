<!DOCTYPE html>
<html lang="zh" class="light" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MuseFlow" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>小样 - MuseFlow</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body class="min-h-screen font-sans antialiased bg-background text-foreground grain-bg">
  <div id="app-shell" class="app-shell">
    <div class="page-frame bg-background relative z-10">
      <header class="px-4 pb-3 border-b border-border bg-card/50 sticky top-0 z-10 backdrop-blur" style="padding-top: var(--museflow-safe-top);">
        <div class="flex items-end justify-between">
          <div class="flex items-center gap-2">
            <i data-lucide="music" class="w-6 h-6 text-primary"></i>
            <div>
              <h1 class="text-base font-semibold leading-tight">小样</h1>
              <p class="text-xs text-muted-foreground leading-tight">上传音频，自动检测调式与 BPM</p>
            </div>
          </div>
        </div>
      </header>

      <main class="page-main px-4 py-5 space-y-5">
        <!-- Upload zone -->
        <section id="upload-zone" class="bg-card border border-border rounded-2xl p-4 shadow-sm cursor-pointer transition-all duration-200">
          <div class="border-2 border-dashed border-border rounded-xl p-6 text-center hover:border-primary/50 hover:bg-primary/[0.03] transition-all duration-200">
            <input type="file" id="file-input" accept="audio/*,.mid,.midi" class="hidden" />
            <div class="flex flex-col items-center gap-3">
              <div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center">
                <i data-lucide="upload-cloud" class="w-6 h-6 text-primary"></i>
              </div>
              <div>
                <p class="text-sm font-medium text-foreground">选择音频或 MIDI 文件</p>
                <p class="text-xs text-muted-foreground mt-0.5">支持 MP3、WAV、OGG、FLAC、MIDI</p>
              </div>
              <button type="button" id="browse-btn" class="mt-1 px-4 py-2 rounded-lg bg-primary text-primary-foreground text-xs font-medium hover:opacity-90 active:scale-[.98] transition-all duration-150">
                选择文件
              </button>
            </div>
          </div>
        </section>

        <!-- Analysis status / result -->
        <section id="analysis-section" class="hidden">
          <!-- Analyzing state -->
          <div id="analyzing-state" class="hidden bg-card border border-border rounded-2xl p-4 shadow-sm flex items-center gap-4">
            <div class="w-10 h-10 rounded-full bg-primary/20 flex items-center justify-center shrink-0">
              <div class="w-5 h-5 border-2 border-primary/30 border-t-primary rounded-full animate-spin"></div>
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium" id="analyzing-title">正在分析…</p>
              <p class="text-xs text-muted-foreground" id="analyzing-sub">解码音频并检测节拍</p>
            </div>
          </div>

          <!-- Result state -->
          <div id="result-state" class="hidden bg-card border border-border rounded-2xl p-4 shadow-sm">
            <div class="flex items-center gap-2 mb-4">
              <i data-lucide="audio-waveform" class="w-4 h-4 text-primary"></i>
              <h2 class="text-sm font-medium" id="result-filename">分析结果</h2>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div class="rounded-xl p-4 text-center" style="background: rgba(229, 62, 62, 0.06); border: 1px solid rgba(229, 62, 62, 0.1);">
                <p class="text-xs text-muted-foreground mb-1">调式</p>
                <p id="result-key" class="text-2xl font-semibold text-primary font-mono leading-tight">--</p>
              </div>
              <div class="rounded-xl p-4 text-center" style="background: rgba(229, 62, 62, 0.06); border: 1px solid rgba(229, 62, 62, 0.1);">
                <p class="text-xs text-muted-foreground mb-1">BPM</p>
                <p id="result-bpm" class="text-2xl font-semibold text-primary font-mono leading-tight">--</p>
              </div>
            </div>
            <div class="mt-4 flex gap-2">
              <button type="button" id="save-result-btn" class="flex-1 py-2.5 rounded-lg bg-primary text-primary-foreground text-sm font-medium hover:opacity-90 active:scale-[.98] transition-all duration-150">
                保存为小样
              </button>
              <button type="button" id="reanalyze-btn" class="px-4 py-2.5 rounded-lg bg-muted text-muted-foreground text-sm font-medium hover:text-foreground transition-colors duration-150">
                重新选择
              </button>
            </div>
          </div>
        </section>

        <!-- Saved demos list -->
        <section class="space-y-3" id="demo-list-section">
          <div class="flex items-center justify-between px-1">
            <h2 class="text-base font-semibold flex items-center gap-1.5"><i data-lucide="folder-open" class="w-4 h-4 text-primary"></i>已保存的小样</h2>
            <div class="flex items-center gap-2">
              <button type="button" id="demos-toggle-select" class="text-[11px] px-2 py-1 rounded-md text-muted-foreground hover:text-foreground hover:bg-muted transition-colors">
                <i data-lucide="check-square" class="w-3.5 h-3.5 inline align-middle mr-1"></i>多选
              </button>
              <span id="demo-count" class="text-xs text-muted-foreground"></span>
            </div>
          </div>
          <!-- 多选工具栏 -->
          <div id="demos-select-bar" class="hidden mb-2 flex items-center gap-2 p-2 rounded-lg bg-muted/50 border border-border">
            <label class="flex items-center gap-1.5 text-xs cursor-pointer select-none">
              <input type="checkbox" id="demos-select-all" class="accent-primary rounded-sm" />
              <span>全选</span>
            </label>
            <span class="text-xs text-muted-foreground" id="demos-selected-count">已选 0 项</span>
            <div class="ml-auto flex items-center gap-1.5">
              <button type="button" id="demos-batch-delete" class="px-2.5 py-1 rounded-md bg-destructive/15 text-destructive text-xs font-medium flex items-center gap-1 hover:bg-destructive/25 transition-colors" disabled>
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>批量删除
              </button>
              <button type="button" id="demos-select-cancel" class="px-2.5 py-1 rounded-md text-xs text-muted-foreground hover:text-foreground hover:bg-muted transition-colors">取消</button>
            </div>
          </div>
          <div id="demo-list" class="space-y-2">
            <!-- populated by JS -->
          </div>
        </section>

        <!-- Empty state -->
        <section id="empty-state" class="py-8 flex flex-col items-center text-center">
          <div class="empty-state-icon w-14 h-14 rounded-full flex items-center justify-center mb-3">
            <i data-lucide="music-2" class="w-6 h-6"></i>
          </div>
          <p class="text-sm text-muted-foreground">上传文件后，检测结果会出现在这里</p>
        </section>
      </main>
      <!-- nav mounted by JS -->
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- 确认弹框（通用） -->
  <div id="confirm-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm items-center justify-center p-4" style="display: none;">
    <div class="w-full max-w-sm bg-card border border-border rounded-2xl shadow-xl p-5">
      <div class="flex items-start gap-3 mb-4">
        <div class="w-10 h-10 shrink-0 rounded-full bg-destructive/15 flex items-center justify-center">
          <i data-lucide="alert-triangle" class="w-5 h-5 text-destructive"></i>
        </div>
        <div class="flex-1 min-w-0">
          <h3 class="text-base font-semibold mb-1">确认操作</h3>
          <p id="confirm-message" class="text-sm text-muted-foreground leading-relaxed"></p>
        </div>
      </div>
      <div class="flex justify-end gap-2">
        <button type="button" id="confirm-cancel" class="px-4 py-2 rounded-lg border border-border text-sm hover:bg-muted transition-colors">取消</button>
        <button type="button" id="confirm-ok" class="px-4 py-2 rounded-lg bg-primary text-primary-foreground text-sm font-medium hover:opacity-90 active:scale-[.99] transition-all duration-150">确定</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/pages/demos.js"></script>
</body>
</html>
